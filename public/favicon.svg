<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Steam VGUI background with 3D bevel border -->
  <rect width="32" height="32" fill="#4B5844"/>
  <line x1="0" y1="0" x2="32" y2="0" stroke="#7A8B71" stroke-width="1.5"/>
  <line x1="0" y1="0" x2="0" y2="32" stroke="#7A8B71" stroke-width="1.5"/>
  <line x1="0" y1="32" x2="32" y2="32" stroke="#000000" stroke-width="1.5"/>
  <line x1="32" y1="0" x2="32" y2="32" stroke="#000000" stroke-width="1.5"/>
  
  <!-- Inset circle -->
  <circle cx="16" cy="16" r="12" fill="#3E4637" stroke="#343D2F" stroke-width="1"/>
  
  <!-- Iconic Half-Life Lambda in Gold -->
  <text x="16" y="22" font-family="Tahoma, 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="18" fill="#E2B038" text-anchor="middle">λ</text>
</svg>
